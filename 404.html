<!DOCTYPE html>
<html lang="es" class="js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1626">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Southpaw Boxing Club</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preload" href="/assets/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css?v=20261125d">
  <style>
    .ko__board {
      position: relative; aspect-ratio: 1; width: min(100%, 440px); justify-self: center;
      border: 2px solid rgba(227, 167, 47, .55); box-shadow: 14px 14px 0 rgba(227, 167, 47, .16);
      display: grid; place-items: center;
    }
    .ko__count {
      margin: 0;
      font-family: var(--font-display); font-size: clamp(110px, 22vw, 240px); line-height: 1;
      color: #F4EFE4; text-shadow: 0 6px 0 rgba(0,0,0,.35);
    }
    .ko__count.is-beat { animation: ko-beat .35s ease-out; }
    .ko__count.is-ko { color: #E3A72F; font-size: clamp(80px, 16vw, 170px); animation: ko-beat .5s ease-out; }
    .ko__ref {
      position: absolute; left: 16px; bottom: 16px;
      font-family: var(--font-cond); font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      font-size: .85rem; color: #0B1626; background: #E3A72F; padding: 6px 12px;
    }
    @keyframes ko-beat { from { transform: scale(1.35); opacity: .2; } to { transform: none; opacity: 1; } }
    .ko__actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; }
    @media (prefers-reduced-motion: reduce) { .ko__count, .ko__count.is-ko { animation: none; } }
    /* la 404 no tiene menú: sin el hueco de la cabecera */
    .hero { padding-top: clamp(40px, 8vw, 96px); }
    @media (max-width: 640px) {
      .hero {
        min-height: 100svh; justify-content: center;
        padding-top: 28px; padding-bottom: 28px;
        background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
      }
      .hero__grid { gap: 24px; }
      .hero__eyebrow { margin-bottom: 14px; }
      .hero__title { font-size: clamp(44px, 13vw, 60px); }
      .hero__lead { margin-top: 12px; font-size: 1rem; }
      .ko__actions { margin-top: 18px; gap: 10px; }
      .ko__actions .btn { flex: 1 1 100%; }
      .ko__board { width: min(52vw, 200px); box-shadow: 8px 8px 0 rgba(227, 167, 47, .16); }
      .ko__count { font-size: clamp(72px, 22vw, 110px); }
      .ko__count.is-ko { font-size: clamp(56px, 16vw, 80px); }
      .ko__ref { left: 10px; bottom: 10px; font-size: .7rem; padding: 4px 8px; }
    }
    @media (max-width: 640px) and (max-height: 720px) {
      .hero { padding-top: 18px; padding-bottom: 18px; }
      .hero__grid { gap: 16px; }
      .hero__title { font-size: clamp(38px, 11vw, 50px); }
      .ko__actions .btn { min-height: 46px; }
      .ko__board { width: min(40vw, 150px); }
      .ko__count { font-size: clamp(60px, 18vw, 84px); }
      .ko__count.is-ko { font-size: clamp(44px, 13vw, 60px); }
      .ko__ref { display: none; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="container hero__grid">
      <div class="hero__copy">
        <p class="eyebrow hero__eyebrow"><span class="eyebrow__num">Error 404</span> Fuera de combate</p>
        <h1 class="hero__title">
          <span class="hero__title-main">Esta página</span>
          <span class="hero__title-outline">besó la lona</span>
        </h1>
        <p class="hero__lead">El árbitro ya está contando y no se levanta. Vuelve al inicio antes de que llegue a diez.</p>
        <div class="ko__actions">
          <a class="btn btn--primary" href="/">Volver al inicio</a>
          <a class="btn btn--ghost" href="/#contacto">Mi primera clase gratis</a>
        </div>
      </div>
      <div class="ko__board">
        <p class="ko__count" id="count" aria-live="polite">1</p>
        <span class="ko__ref" aria-hidden="true">Cuenta del árbitro</span>
      </div>
    </div>
  </main>
  <script src="/404.js" defer></script>
</body>
</html>
